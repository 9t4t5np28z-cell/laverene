<text x="40.0" y="545.0" font-size="12" fill="#e6eef7" text-anchor="start" font-weight="normal">Visible differences: 60 m taller (about 7%), wings end 300 m sooner, keel doors grouped aft. Length, beam, prow, engine block, island and trench are unchanged.</text>
<text x="40.0" y="595.0" font-size="16" fill="#5fd38d" text-anchor="start" font-weight="bold">WHERE THE FRIGATES ARE — unchanged, on the Frigate Deck in the wings</text>
<text x="40.0" y="615.0" font-size="12" fill="#9fb3c8" text-anchor="start" font-weight="normal">Upper story of each wing, seen from above (port hall shown; starboard mirrors it). 20 Corricks per hall, 40 in all.</text>
