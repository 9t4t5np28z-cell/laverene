<rect x="1010.0" y="740.0" width="930.0" height="450.0" fill="#e8eef6" stroke="#9fb3cc" stroke-width="1.2" />
<text x="1034.0" y="780.0" font-size="19" fill="#1f3350" text-anchor="start" font-weight="bold" letter-spacing="1.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif">DOES A SINGLE SERVICE BAY WORK?</text>
<text x="1034.0" y="820.0" font-size="17" fill="#1f3350" text-anchor="start" font-weight="bold" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Yes, for one battlecruiser at a time.</text>
<text x="1034.0" y="846.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">A 2,100 × 400 × 300 m bay along the keel of midships takes one</text>
<text x="1034.0" y="870.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">2 km battlecruiser with about 20 m clearance all round. The four</text>
<text x="1034.0" y="894.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">rotate through it for heavy maintenance, and a battlecruiser whose</text>
<text x="1034.0" y="918.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">jump drive has failed can ride inside through a jump.</text>
<text x="1034.0" y="942.0" font-size="17" fill="#1f3350" text-anchor="start" font-weight="bold" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">What it costs.</text>
<text x="1034.0" y="968.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">About a seventh of her usable volume, taken from stores and berthing.</text>
<text x="1034.0" y="992.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">The Keep moves forward of the bay. The keel gets one long door set,</text>
<text x="1034.0" y="1016.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">so armour and structure run around it, as with the old dockyards.</text>
<text x="1034.0" y="1040.0" font-size="17" fill="#1f3350" text-anchor="start" font-weight="bold" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">What else fits when no battlecruiser is in.</text>
<text x="1034.0" y="1066.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">About 30 Corricks on one tier, 8 Kangeths, or 4 Casakins: the same</text>
<text x="1034.0" y="1090.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">bay can double as the heavy repair bay for the whole fleet.</text>
<text x="1034.0" y="1114.0" font-size="17" fill="#1f3350" text-anchor="start" font-weight="bold" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">Not at the same time.</text>
<text x="1034.0" y="1140.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">A battlecruiser fills the bay's width. Frigates still need their own</text>
<text x="1034.0" y="1164.0" font-size="16" fill="#1f3350" text-anchor="start" font-weight="normal" letter-spacing="0" font-family="Liberation Sans, Arial, Helvetica, sans-serif">berths for jumps, so the Frigate Deck stays, sized to their number.</text>
</svg>